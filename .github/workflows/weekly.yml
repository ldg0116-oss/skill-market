name: weekly-collect

on:
  schedule:
    - cron: "17 22 * * 0"   # 매주 월요일 07:17 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: 수집
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/collect.py
      - name: 빌드 (marketplace.json · 카탈로그 · 주간 리포트)
        run: python scripts/build.py
      - name: 커밋·푸시
        run: |
          git config user.name "skill-market-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "변경 없음" || (git commit -m "chore: weekly collect $(date -u +%F)" && git push)
